<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NETSCOPE Tab Telemetry</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: #0f172a; color: #f1f5f9; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.45; margin: 0 0 10px; }
    .note { font-size: 11px; color: #38bdf8; border-top: 1px solid #1e293b; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>NETSCOPE Browser Telemetry</h1>
  <p>Streaming active tab titles, domains, and Content-Length estimates locally to NETSCOPE.</p>
  <div class="note">Accuracy: Browser-reported estimate (HTTP headers/payload). Cookies, credentials, and page contents are never collected.</div>
</body>
</html>
